<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Bites - Feedback</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="feedback-page">
  <header>
    <h1>💬 Feedback &amp; Contact</h1>
    <p>We would love to hear from you</p>
  </header>

  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="deals.html">Daily Deals</a>
    <a href="order.html">How to Order</a>
    <a href="feedback.html" aria-current="page">Feedback</a>
  </nav>

  <main>
    <h2>Contact Us</h2>
    <div class="grid-container contact-grid">
      <div class="card">
        <h3>📧 Email</h3>
        <p>campusbites@ucp.edu.pk</p>
      </div>
      <div class="card">
        <h3>📞 Phone</h3>
        <p>+92 42 111 000 827</p>
      </div>
      <div class="card">
        <h3>📍 Visit</h3>
        <p>Student Service Center, Ground Floor</p>
      </div>
    </div>

    <h2 class="form-title">Leave Feedback</h2>
    <form class="feedback-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your Name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Your Email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Your feedback..." required></textarea>

      <button type="submit">Submit Feedback</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Campus Bites - UCP DevOps Project</p>
  </footer>
</body>
</html>
